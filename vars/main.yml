---
# Setting to generate files.

# A list of python version to test.
default_python_version:
  - "python:3.10"
  - "python:3.13"

# The platform/version matrix used to generate CI when a role doesn't define
# its own list in meta/preferences.yml. `galaxy_info.platforms` in
# meta/main.yml is deprecated by ansible-lint's schema (see the 2026-06-24
# "Fix lint schema error by removing platforms metadata" commits across
# every role), so this can no longer live there.
#
# Version support policy: test only the latest 3 releases per distro.
# If a distro has fewer than 3 releases, support all of them.
default_platforms:
  - name: EL
    versions:
      - all
  - name: Debian
    versions:
      - all
  - name: Fedora
    versions:
      - all
  - name: Ubuntu
    versions:
      - all

# A map that relates the `meta/main.yml` - `galaxy_info.platforms.name` to a name of a container.
platform_image_mapping:
  Alpine: docker-molecule-images
  AlmaLinux: docker-molecule-images
  Amazon: docker-molecule-images
  Archlinux: docker-molecule-images
  Debian: docker-molecule-images
  EL: docker-molecule-images
  Fedora: docker-molecule-images
  Kali: docker-molecule-images
  openSUSE: docker-molecule-images
  OracleLinux: docker-molecule-images
  Rocky: docker-molecule-images
  Ubuntu: docker-molecule-images
  Rockylinux: docker-molecule-images
  Almalinux: docker-molecule-images

# A map that relates a container name to the URL of that container on Docker Hub.
image_docker_hub_url_mapping:
  alpine: "https://hub.docker.com/r/{{ docker_namespace }}/docker-molecule-images"
  amazon: "https://hub.docker.com/r/{{ docker_namespace }}/docker-molecule-images"
  archlinux: "https://hub.docker.com/r/{{ docker_namespace }}/docker-molecule-images"
  debian: "https://hub.docker.com/r/{{ docker_namespace }}/docker-molecule-images"
  el: "https://hub.docker.com/r/{{ docker_namespace }}/docker-molecule-images"
  fedora: "https://hub.docker.com/r/{{ docker_namespace }}/docker-molecule-images"
  kali: "https://hub.docker.com/r/{{ docker_namespace }}/docker-molecule-images"
  opensuse: "https://hub.docker.com/r/{{ docker_namespace }}/docker-molecule-images"
  ubuntu: "https://hub.docker.com/r/{{ docker_namespace }}/docker-molecule-images"
  almalinux: "https://hub.docker.com/r/{{ docker_namespace }}/docker-molecule-images"
  rockylinux: "https://hub.docker.com/r/{{ docker_namespace }}/docker-molecule-images"
  oraclelinux: "https://hub.docker.com/r/{{ docker_namespace }}/docker-molecule-images"
  rhel-ubi: "https://hub.docker.com/r/{{ docker_namespace }}/docker-molecule-images"

# This maps the Galaxy distribution and version to Docker images.
# A map that relates the `meta/main.yml` - `galaxy_info.platforms.versions` to the tag of the Docker container.
#
# Version support policy: for each distro, list only the latest 3 releases
# under `all:`. If fewer than 3 releases exist, list all of them. When a
# role specifies a concrete version, resolve it to the corresponding tag(s).
distribution_version_mapping:
  Alpine:
    all:
      - alpine-openrc
  AlmaLinux:
    all:
      - almalinux10  # 10
      - almalinux9   # 9
      - almalinux8   # 8
    "10":
      - almalinux10
    "9":
      - almalinux9
    "8":
      - almalinux8
  Amazon:
    all:
      - amazonlinux2023
    "2023":
      - amazonlinux2023
  Archlinux:
    all:
      - archlinux
  Debian:
    all:
      - debian13  # 13 (trixie)
      - debian12  # 12 (bookworm)
      # debian11 (bullseye) dropped from `all` per version support policy
      # (latest 3 -> now 12/13 only); several roles already pinned this
      # exclusion individually (see e.g.
      # ansible-role-netdata/meta/preferences.yml).
    trixie:
      - debian13
    bookworm:
      - debian12
    bullseye:
      - debian11
    # Release-number aliases of the codenames above - some roles pin
    # meta/preferences.yml versions by number instead of codename, and
    # dropping these breaks generation for them (dict has no attribute).
    "13":
      - debian13
    "12":
      - debian12
    "11":
      - debian11
  EL:
    all:
      - rockylinux10
      - almalinux10
      - rockylinux9
      - almalinux9
      - rockylinux8
      - almalinux8
    "10":
      - rockylinux10
      - almalinux10
    "9":
      - rockylinux9
      - almalinux9
    "8":
      - rockylinux8
      - almalinux8
  Fedora:
    all:
      - fedora45
      - fedora44
      - fedora43
    "45":
      - fedora45
    "42":
      - fedora42
    "43":
      - fedora43
    "44":
      - fedora44
  Kali:
    all:
      - kalilinux
  openSUSE:
    all:
      - opensuse  # 16.0 (Leap)
      - opensuse-tumbleweed
    "16.0":
      - opensuse
    tumbleweed:
      - opensuse-tumbleweed
  OracleLinux:
    all:
      - oraclelinux10
      - oraclelinux9
      - oraclelinux8
    "10":
      - oraclelinux10
    "9":
      - oraclelinux9
    "8":
      - oraclelinux8
  Rocky:
    all:
      - rockylinux10
      - rockylinux9
      - rockylinux8
    "8":
      - rockylinux8
    "9":
      - rockylinux9
    "10":
      - rockylinux10
  # SLES intentionally omitted: sles12/sles15 in docker-molecule-images
  # require a paid SUSE subscription to pull the base image (see that
  # repo's sles12/README.md) - CI on this platform can never go green
  # without credentials this project doesn't have.
  Ubuntu:
    all:
      - ubuntu2604  # 26 (resolute)
      - ubuntu2404  # 24 (noble)
      - ubuntu2204  # 22 (jammy)
    resolute:
      - ubuntu2604
    noble:
      - ubuntu2404
    jammy:
      - ubuntu2204
    focal:
      - ubuntu2004
    bionic:
      - ubuntu1804
    # Release-number aliases of the codenames above - some roles pin
    # meta/preferences.yml versions by number instead of codename, and
    # dropping these breaks generation for them (dict has no attribute).
    # focal/bionic are outside the "latest 3" policy but still valid
    # explicit pins - some roles need an old LTS deliberately.
    "26.04":
      - ubuntu2604
    "24.04":
      - ubuntu2404
    "22.04":
      - ubuntu2204
    "20.04":
      - ubuntu2004
    "18.04":
      - ubuntu1804

