---
name: Test CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install ansible yamllint

      - name: Run generator against default fixture
        working-directory: tests/ansible-role-default
        run: ansible-playbook $GITHUB_WORKSPACE/generate.yml --extra-vars "generate_pre_commit=no"

      - name: Validate generated output
        run: yamllint -c .yamllint tests/ansible-role-default
